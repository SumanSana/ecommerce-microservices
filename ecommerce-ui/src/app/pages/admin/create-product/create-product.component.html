<div class="container my-5">
  <div class="card shadow-sm p-4 border-0">
    <h3 class="mb-4 fw-bold text-dark border-bottom pb-2">Create New Product</h3>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Product Name</label>
          <input type="text" class="form-control" formControlName="name" 
                 [class.is-invalid]="productForm.get('name')?.touched && productForm.get('name')?.invalid">
        </div>

        <div class="col-md-3">
          <label class="form-label fw-semibold">Brand</label>
          <input type="text" class="form-control" formControlName="brandName" list="brandOptions"
                 [class.is-invalid]="productForm.get('brandName')?.errors?.['invalidSelection']">
          <datalist id="brandOptions">
            @for (b of brands(); track b.id) { <option [value]="b.name"></option> }
          </datalist>
          <div class="invalid-feedback">Please select a valid brand.</div>
        </div>

        <div class="col-md-3">
          <label class="form-label fw-semibold">Category</label>
          <input type="text" class="form-control" formControlName="categoryName" list="catOptions"
                 [class.is-invalid]="productForm.get('categoryName')?.errors?.['invalidSelection']">
          <datalist id="catOptions">
            @for (c of categories(); track c.id) { <option [value]="c.name"></option> }
          </datalist>
          <div class="invalid-feedback">Please select a valid category.</div>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Description</label>
        <textarea class="form-control" formControlName="description" rows="2" placeholder="Brief overview..."></textarea>
      </div>

      <hr class="text-muted opacity-25">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h5 class="mb-0 text-primary fw-bold">Inventory Variants (SKUs)</h5>
        <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3" (click)="addVariant()">
          <i class="bi bi-plus"></i> Add Variant
        </button>
      </div>

      <div formArrayName="variants">
        @for (variant of variants.controls; track $index) {
          <div [formGroupName]="$index" class="card mb-3 border bg-light shadow-none">
            <div class="card-body">
              <div class="row g-3">
                <div class="col-md-3">
                  <label class="small fw-bold text-uppercase text-muted">SKU ID</label>
                  <input type="text" class="form-control form-control-sm" formControlName="skuId" placeholder="e.g. SKU-001">
                </div>
                
                <div class="col-md-2">
                  <label class="small fw-bold text-uppercase text-muted">Price (₹)</label>
                  <input type="number" class="form-control form-control-sm" formControlName="price">
                </div>

                <div class="col-md-3">
                  <label class="small fw-bold text-uppercase text-muted">Image File</label>
                  <input type="file" class="form-control form-control-sm" (change)="onFileSelected($event, $index)" accept="image/*">
                </div>

                <div class="col-md-4">
                  <label class="small fw-bold text-uppercase text-muted">Attributes</label>
                  <input type="text" class="form-control form-control-sm" formControlName="attributesText" 
                         placeholder="e.g. Color: Navy, Material: Mesh">
                </div>
              </div>

              @if (variants.length > 1) {
                <div class="text-end mt-2">
                  <button type="button" class="btn btn-link text-danger text-decoration-none btn-sm" (click)="removeVariant($index)">
                    <i class="bi bi-trash"></i> Remove Variant
                  </button>
                </div>
              }
            </div>
          </div>
        }
      </div>

      <div class="mt-5">
        <button type="submit" class="btn btn-success w-100 py-2 shadow-sm fw-bold" 
                [disabled]="productForm.invalid || isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm me-2"></span> Saving...
          } @else {
            <i class="bi bi-check-circle me-2"></i> Create Product
          }
        </button>
      </div>

    </form>
  </div>
</div>
