<div class="container-fluid p-4 bg-light min-vh-100">
  <div class="d-flex align-items-center mb-4">
    <button routerLink="/admin/manage-product" class="btn btn-outline-dark border-0 rounded-circle me-3">
      <i class="bi bi-arrow-left fs-4"></i>
    </button>
    <div>
      <h3 class="fw-bold mb-0 text-dark">Edit Product</h3>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a routerLink="/admin/manage-product" class="text-decoration-none text-muted">Manage Products</a></li>
          <li class="breadcrumb-item active">Update Details</li>
        </ol>
      </nav>
    </div>
  </div>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <div class="row g-4">
      
      <div class="col-xl-4 col-lg-5">
        <div class="card border-0 shadow-sm p-4 rounded-4">
          <h5 class="fw-bold text-secondary mb-4 border-bottom pb-2">Basic Info</h5>
          
          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase">Product Name</label>
            <input formControlName="name" class="form-control shadow-none">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase">Brand</label>
            <input type="text" class="form-control shadow-none" formControlName="brandName" list="brandOptions">
            <datalist id="brandOptions">
              @for (b of brands(); track b.id) { <option [value]="b.name"></option> }
            </datalist>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase">Category</label>
            <input type="text" class="form-control shadow-none" formControlName="categoryName" list="catOptions">
            <datalist id="catOptions">
              @for (c of categories(); track c.id) { <option [value]="c.name"></option> }
            </datalist>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase">Description</label>
            <textarea formControlName="description" class="form-control shadow-none" rows="3"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold small text-uppercase">Global Status</label>
            <select formControlName="status" class="form-select shadow-none">
              <option value="ACTIVE">ACTIVE</option>
              <option value="INACTIVE">INACTIVE</option>
            </select>
          </div>
        </div>
      </div>

      <div class="col-xl-8 col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="fw-bold text-secondary mb-0">Variants Config</h5>
          <button type="button" (click)="addVariant()" class="btn btn-dark btn-sm rounded-pill px-3">
            <i class="bi bi-plus-circle me-2"></i>New Variant
          </button>
        </div>

        <div formArrayName="variants">
          <div *ngFor="let v of variants.controls; let i=index" [formGroupName]="i" 
               class="card border-0 shadow-sm mb-3 rounded-4 overflow-hidden">
            <div class="card-body">
              <div class="row g-3">
                
                <div class="col-md-2 text-center border-end">
                  <div class="image-preview-box mb-2">
                    <img [src]="previews[i] || v.get('imageUrl')?.value || 'assets/placeholder-shoe.png'" 
                         class="rounded shadow-sm img-fluid" style="max-height: 80px; object-fit: contain;">
                  </div>
                  <label class="btn btn-warning btn-sm w-100 fw-bold rounded-pill">
                    <input type="file" (change)="onFileSelected($event, i)" hidden>
                    Upload
                  </label>
                </div>

                <div class="col-md-10">
                  <div class="row g-3">
                    <div class="col-md-5">
                      <label class="form-label x-small fw-bold">SKU ID</label>
                      <input formControlName="skuId" class="form-control shadow-none" [readonly]="!v.get('isNew')?.value">
                    </div>
                    <div class="col-md-3">
                      <label class="form-label x-small fw-bold">Price (₹)</label>
                      <input formControlName="price" type="number" class="form-control shadow-none">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label x-small fw-bold">Status</label>
                      <select formControlName="status" class="form-select shadow-none">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                      </select>
                    </div>

                    <div class="col-12 mt-3 pt-3 border-top">
                      <div class="d-flex justify-content-between align-items-center mb-2">
                        <button type="button" (click)="addAttribute(i)" class="btn btn-link btn-sm text-decoration-none p-0 fw-bold">
                          + Add Property
                        </button>
                      </div>

                      <div class="row g-2">
                        @for (key of getAttributeKeys(i); track key) {
                          <div class="col-md-6">
                            <div class="input-group input-group-sm">
                              <input type="text" [value]="key" #keyInput
                                     class="form-control bg-light fw-bold" placeholder="Key"
                                     (change)="updateAttribute(i, key, keyInput.value, valInput.value)">
                              
                              <span class="input-group-text border-0 bg-transparent">:</span>
                              
                              <input type="text" [value]="v.get('attributes')?.value[key]" #valInput
                                     class="form-control shadow-none" placeholder="Value"
                                     (input)="updateAttribute(i, key, keyInput.value, valInput.value)">
                              
                              <button class="btn btn-outline-danger" type="button" (click)="removeAttribute(i, key)">
                                <i class="bi bi-x-lg"></i>
                              </button>
                            </div>
                          </div>
                        } @empty {
                          <div class="col-12">
                            <span class="text-muted small">No specific attributes defined for this SKU.</span>
                          </div>
                        }
                      </div>
                    </div>
                    </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="sticky-bottom bg-light py-3 border-top mt-4 shadow-sm px-3 rounded-top-4">
          <button type="submit" [disabled]="isSubmitting || productForm.invalid" class="btn btn-warning btn-lg w-100 fw-bold shadow-sm py-3 rounded-pill">
            <span *ngIf="!isSubmitting"><i class="bi bi-cloud-upload-fill me-2"></i>SAVE PRODUCT</span>
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
          </button>
        </div>

      </div>
    </div>
  </form>
</div>
