<div class="container vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 500px;">
    <div class="bg-danger" style="height: 6px;"></div>
    
    <div class="card-body p-5 text-center">
      <div class="mb-4">
        <div class="display-1 text-danger animate-bounce">
          <i class="bi bi-shield-lock"></i>
        </div>
      </div>
      
      <h2 class="fw-bold text-dark mb-2">Access Denied</h2>
      
      <p class="text-muted mb-4 px-2">
        {{ message || 'You do not have the required administrator privileges to access this resource.' }}
      </p>

      <div class="alert alert-light border small text-start mb-4 py-3">
        <div class="d-flex align-items-center">
          <i class="bi bi-exclamation-octagon-fill me-2 text-danger"></i>
          <div>
            <strong class="text-dark">Error 403:</strong> 
            This area is restricted to accounts with <code>ADMIN</code> roles.
          </div>
        </div>
      </div>

      <div class="d-grid gap-2">
        <button (click)="navigateToHome()" class="btn btn-dark btn-lg rounded-pill fw-bold shadow-sm">
          <i class="bi bi-house-door me-2"></i>Return to Catalog
        </button>
        
        <div class="row g-2 mt-1">
          <div class="col-6">
            <button routerLink="/login" class="btn btn-outline-secondary w-100 rounded-pill">
              Switch User
            </button>
          </div>
          <div class="col-6">
            <button (click)="navigateToHome()" class="btn btn-outline-dark w-100 rounded-pill">
              Cancel
            </button>
          </div>
        </div>
      </div>

      <div class="mt-4 pt-3 border-top">
        <span class="text-uppercase extra-small fw-bold text-secondary">DevShop Security Protocol</span>
      </div>
    </div>
  </div>
</div>
