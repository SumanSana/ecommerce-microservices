<div class="container py-5 my-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5 text-center">
      
      <div class="d-flex justify-content-center mb-4">
        <div class="rounded-circle bg-success d-flex align-items-center justify-content-center shadow-lg" 
             style="width: 100px; height: 100px;">
          <i class="bi bi-check-lg display-3 text-white"></i>
        </div>
      </div>

      <h1 class="fw-bold text-dark mb-3">Order Successful!</h1>
      <p class="text-muted mb-4 px-3">
        Thank you for your purchase. We've received your order and are getting it ready for shipment.
      </p>

      <div class="card border-0 bg-light rounded-4 p-4 mb-4 shadow-sm text-center">
        <span class="text-uppercase small fw-bold text-secondary mb-2 d-block">Order Reference</span>
        <code class="h5 text-primary fw-bold text-break mb-0">
          {{ orderId() || 'Processing...' }}
        </code>
      </div>

      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mb-5">
        <button routerLink="/" class="btn btn-primary btn-lg px-4 rounded-pill fw-bold">
          Continue Shopping
        </button>
        <button routerLink="/my-orders" class="btn btn-outline-dark btn-lg px-4 rounded-pill fw-bold">
          View Orders
        </button>
      </div>

      <div class="border-top pt-4">
        <p class="small text-muted mb-0">
          <i class="bi bi-envelope me-2"></i>A confirmation email has been sent to you.
        </p>
      </div>

    </div>
  </div>
</div>
